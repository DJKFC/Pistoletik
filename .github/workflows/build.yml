name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Pistoletik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pistoletik
          path: Pistoletik.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pistoletik — сборка #${{ github.run_number }}"
          body: "Скачай Pistoletik.apk ниже и установи на телефон. Новые сборки ставятся поверх старой."
          files: Pistoletik.apk
          make_latest: true
